# Checks the stories on every push and pull request, and publishes the site to
# GitHub Pages whenever the default branch changes. If a story has a mistake the
# check fails and the live site is left as it was.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Check & publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check stories
        run: npm run check
      - name: Run tests
        run: npm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GitHub Pages lets browsers cache files for 10 minutes. Stamping every
      # asset URL with the commit stops a browser mixing old and new files.
      - name: Stamp asset URLs with the commit
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -e "s#href=\"styles.css\"#href=\"styles.css?v=$v\"#" \
                 -e "s#src=\"src/app.js\"#src=\"src/app.js?v=$v\"#" index.html
          sed -i -E "s#(from \"\.{1,2}/[^\"?]+\.m?js)\"#\1?v=$v\"#" src/*.js
          # 2 in index.html + 4 imports in src/; fail loudly if a pattern stopped matching.
          test "$(cat index.html src/*.js | grep -o "?v=$v" | wc -l)" -eq 6
      - name: Record which commit is live
        run: |
          printf '{"repo":"%s","branch":"%s","sha":"%s","time":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
